<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="MyFinance — Premium Personal Finance Manager. Track bills, expenses, and receipts — offline, private, free.">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MyFinance">
  <meta name="mobile-web-app-capable" content="yes">

  <title>MyFinance — Personal Finance Manager</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">

  <script>
    (function() {
      const saved = localStorage.getItem('mf_theme');
      const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const theme = saved || preferred;
      document.documentElement.setAttribute('data-theme', theme);
      if (!saved) localStorage.setItem('mf_theme', theme);
    })();
  </script>
</head>
<body>

<div id="app" class="app">

  <!-- ── Sidebar (Desktop) ── -->
  <aside id="sidebar" class="sidebar" role="complementary">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect width="20" height="20" rx="5" fill="white" fill-opacity="0.15"/>
            <path d="M5 14V6h7v2H7v1.5h4v2H7V14H5z" fill="white"/>
            <circle cx="14" cy="12" r="2.5" fill="white" fill-opacity="0.7"/>
          </svg>
        </div>
        <span class="logo-text">MyFinance</span>
      </div>
      <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Collapse sidebar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Main navigation">
      <a href="#dashboard" class="nav-item active" data-page="dashboard" aria-current="page">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span>Dashboard</span>
      </a>
      <a href="#commitments" class="nav-item" data-page="commitments">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.5"/>
          <path d="M6 7h8M6 10h8M6 13h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Commitments</span>
      </a>
      <a href="#expenses" class="nav-item" data-page="expenses">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M10 2v16M6 6h6a2 2 0 010 4H8a2 2 0 000 4h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Expenses</span>
      </a>
      <a href="#receipts" class="nav-item" data-page="receipts">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M4 2h9l4 4v12a1 1 0 01-1 1H4a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5"/>
          <path d="M13 2v4h4M7 9h6M7 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Receipts</span>
      </a>
      <a href="#reports" class="nav-item" data-page="reports">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.5"/>
          <path d="M5 14l3.5-4 3 2 3.5-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Reports</span>
      </a>
      <a href="#debt" class="nav-item" data-page="debt">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10 6v4l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Debt</span>
      </a>
      <a href="#budget" class="nav-item" data-page="budget">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <rect x="2" y="5" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <path d="M2 9h16" stroke="currentColor" stroke-width="1.5"/>
          <path d="M6 13h3M13 13h1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Budget</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle colour theme">
        <svg id="theme-icon-light" class="theme-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="10" cy="10" r="4" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.93 4.93l1.41 1.41M13.66 13.66l1.41 1.41M4.93 15.07l1.41-1.41M13.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <svg id="theme-icon-dark" class="theme-icon hidden" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span id="theme-label">Dark Mode</span>
      </button>
    </div>
  </aside>

  <!-- ── Main Content ── -->
  <main id="main" class="main">

    <!-- Sticky Header -->
    <header id="header" class="header" role="banner">
      <div class="header-left">
        <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Open navigation menu" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <h1 id="page-title" class="page-title">Dashboard</h1>
      </div>
      <div class="header-right">
        <div id="install-btn-container" class="hidden">
          <button id="install-btn" class="btn btn-primary btn-sm" aria-label="Install MyFinance app">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v9M5 8l3 3 3-3M2 14h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Install App
          </button>
        </div>
        <button id="header-theme-toggle" class="icon-btn" aria-label="Toggle colour theme">
          <svg id="header-theme-icon-light" viewBox="0 0 20 20" fill="none" width="18" height="18" aria-hidden="true">
            <circle cx="10" cy="10" r="4" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.93 4.93l1.41 1.41M13.66 13.66l1.41 1.41M4.93 15.07l1.41-1.41M13.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg id="header-theme-icon-dark" viewBox="0 0 20 20" fill="none" width="18" height="18" class="hidden" aria-hidden="true">
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <div id="page-container" class="page-container" role="main" aria-live="polite" aria-atomic="false">
    </div>

  </main>

  <!-- ── Bottom Navigation (Mobile) ── -->
  <nav id="bottom-nav" class="bottom-nav" aria-label="Mobile navigation">
    <a href="#dashboard" class="bottom-nav-item active" data-page="dashboard" aria-label="Dashboard">
      <svg class="bottom-nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
        <rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
        <rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
        <rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span class="bottom-nav-label">Home</span>
    </a>
    <a href="#commitments" class="bottom-nav-item" data-page="commitments" aria-label="Commitments">
      <svg class="bottom-nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.5"/>
        <path d="M6 7h8M6 10h8M6 13h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="bottom-nav-label">Commitments</span>
    </a>
    <a href="#expenses" class="bottom-nav-item" data-page="expenses" aria-label="Expenses">
      <svg class="bottom-nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M10 2v16M6 6h6a2 2 0 010 4H8a2 2 0 000 4h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="bottom-nav-label">Expenses</span>
    </a>
    <a href="#receipts" class="bottom-nav-item" data-page="receipts" aria-label="Receipts">
      <svg class="bottom-nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M4 2h9l4 4v12a1 1 0 01-1 1H4a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M13 2v4h4M7 9h6M7 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="bottom-nav-label">Receipts</span>
    </a>
    <a href="#reports" class="bottom-nav-item" data-page="reports" aria-label="Reports">
      <svg class="bottom-nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.5"/>
        <path d="M5 14l3.5-4 3 2 3.5-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="bottom-nav-label">Reports</span>
    </a>
    <a href="#debt" class="bottom-nav-item" data-page="debt" aria-label="Debt Tracker">
      <svg class="bottom-nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 6v4l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="bottom-nav-label">Debt</span>
    </a>
    <a href="#budget" class="bottom-nav-item" data-page="budget" aria-label="Budget Planner">
      <svg class="bottom-nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <rect x="2" y="5" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M2 9h16" stroke="currentColor" stroke-width="1.5"/>
        <path d="M6 13h3M13 13h1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="bottom-nav-label">Budget</span>
    </a>
  </nav>

  <!-- ── Global UI Slots ── -->
  <div id="fab-container" class="fab-container" aria-label="Quick actions"></div>
  <div id="toast-container" class="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-container" class="modal-container" aria-modal="true"></div>
  <div id="sidebar-overlay" class="sidebar-overlay hidden" aria-hidden="true"></div>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<!-- Core — ?v=2 busts browser cache after the modalId fix -->
<script src="js/db.js?v=2"></script>
<script src="js/utils.js?v=2"></script>
<script src="js/store.js?v=2"></script>
<script src="js/router.js?v=2"></script>

<!-- Components -->
<script src="components/toast.js?v=2"></script>
<script src="components/modal.js?v=2"></script>
<script src="components/fab.js?v=2"></script>

<!-- Pages -->
<script src="pages/dashboard.js?v=2"></script>
<script src="pages/commitments.js?v=2"></script>
<script src="pages/expenses.js?v=2"></script>
<script src="pages/receipts.js?v=2"></script>
<script src="pages/reports.js?v=2"></script>
<script src="pages/debt.js?v=2"></script>
<script src="pages/budget.js?v=2"></script>

<!-- App bootstrap -->
<script src="js/app.js?v=2"></script>

</body>
</html>
